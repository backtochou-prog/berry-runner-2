<style>
  @font-face { font-family: Fredoka; src: url(assets/fonts/fredoka.woff2) format('woff2'); font-weight: 300 700; font-display: swap; }   /* the game's font (SIL Open Font License, assets/fonts/OFL-Fredoka.txt): the menus */
  html, body { margin: 0; height: 100%; background: #151022; overflow: hidden; overscroll-behavior: none; }
  body { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); height: 100dvh; display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  /* the 3D view fills the window; the pixel-art HUD/menu canvas (320x180, whole-number scale) sits centred on top of it */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* BERRY RUNNER 2: the 3D picture a touch richer (more colour, a little more contrast), done by the compositor on the finished frame: no change to any material or light. ?fx=0 turns it off. */
  #gl.rich { filter: saturate(1.16) contrast(1.05); }
  #screen { position: relative; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; background: transparent; }
  /* the touch buttons are drawn smooth, on their own canvas at the device's resolution, over the pixel overlay (clicks pass through it) */
  #touch { position: fixed; left: 0; top: 0; pointer-events: none; image-rendering: auto; background: transparent; touch-action: none; }
  /* the suggestion to turn an upright phone (the 2D page's own line, style.css): under the screen canvas, never over the game or its controls, and it takes no touches */
  #rotate { display: none; position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; font: 11px/1 monospace; letter-spacing: 1px; color: #e8a33d; text-shadow: 0 1px 0 #1b1420, 0 0 6px #1b1420; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, #2a1250 0%, #151022 70%); transition: opacity .45s ease; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .b-logo { display: flex; flex-direction: column; align-items: center; line-height: 1; font-family: Fredoka, "Trebuchet MS", "Segoe UI", sans-serif; }
  #boot .b-logo i { font-size: min(15vw, 64px); font-weight: 700; color: #fff; text-shadow: 0 0 18px #ff4f9e, 0 3px 0 #c2246e; }
  #boot .b-logo b { margin-top: 6px; font-size: min(5vw, 22px); letter-spacing: .28em; color: #8dff1a; text-shadow: 0 0 10px rgba(141,255,26,.6); }
  #boot .b-bar { width: min(60vw, 260px); height: 8px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); overflow: hidden; }
  #boot-fill { width: 0; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ff4f9e, #ffd23a); transition: width .2s ease; }
  #boot .b-tip { font: 600 11px/1 Fredoka, system-ui, sans-serif; letter-spacing: .22em; color: #b9a2ff; }
